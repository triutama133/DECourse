<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge – Learn Data Engineering by Doing</title>
  <meta name="color-scheme" content="light dark" />
  <script>
    /* Set the theme before the first paint, so a dark page never flashes white. Same rule as app.js: saved choice, else the system setting. */
    (function () {
      try {
        var t = localStorage.getItem("df_theme");
        try { t = JSON.parse(t); } catch (e) { /* plain text from an older version */ }
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* storage blocked: app.js picks the theme */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=74" />
  <link rel="stylesheet" href="css/job-career.css?v=2" />
  <link rel="stylesheet" href="css/interview-sim.css?v=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230369a1'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EDF%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main-content" onclick="document.getElementById('main-content').focus()">Skip to content / Lewati ke konten</a>

  <header class="site-header no-print">
    <div class="header-inner">
      <button class="brand" onclick="app.go('roadmap')" aria-label="DataForge home">
        <span class="brand-mark">DF</span>
        <span class="brand-name">DataForge</span>
      </button>

      <div class="header-tools">
        <div id="header-gamification" class="gamification-bar" aria-label="Learning streak and XP"></div>
        <button class="icon-btn" id="tutor-btn" data-state="off" aria-pressed="false" onclick="tutor.onHeaderClick()" title="AI tutor">
          <span class="tutor-dot" aria-hidden="true"></span><span aria-hidden="true">🎓</span>
          <span class="icon-btn-label" id="tutor-btn-label">Tutor</span>
        </button>
        <button class="icon-btn" id="glossary-btn" onclick="app.go('glossary')" aria-label="Glossary" title="Glossary">
          <span aria-hidden="true">📖</span>
          <span class="icon-btn-label" id="glossary-btn-label">Glossary</span>
        </button>
        <button class="icon-btn" id="search-btn" onclick="app.openSearch()" aria-label="Search the course (Ctrl+K)" title="Ctrl+K">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
          <span class="icon-btn-label" id="search-btn-label">Search</span>
        </button>
        <div class="settings">
          <button class="icon-btn" id="settings-btn" onclick="app.toggleSettings()" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu" title="Display">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
            <span class="icon-btn-label" id="settings-btn-label">Display</span>
          </button>
          <div class="settings-menu" id="settings-menu" role="menu" hidden>
            <button role="menuitemcheckbox" class="settings-row" id="theme-btn" onclick="app.toggleTheme()"><span id="theme-btn-icon">🌙</span><span id="theme-btn-label">Dark mode</span><span class="settings-state" id="theme-btn-state"></span></button>
            <button role="menuitemcheckbox" class="settings-row" id="a11y-btn" onclick="app.toggleA11yFont()"><span id="a11y-btn-icon">Aa</span><span id="a11y-btn-label">Larger text</span><span class="settings-state" id="a11y-btn-state"></span></button>
            <button role="menuitemcheckbox" class="settings-row" id="sound-btn" onclick="app.toggleSound()"><span id="sound-btn-icon">🔊</span><span id="sound-btn-label">Quiz sounds</span><span class="settings-state" id="sound-btn-state"></span></button>
          </div>
        </div>
        <button class="icon-btn menu-toggle" id="menu-toggle" onclick="app.toggleMenu()" aria-expanded="false" aria-controls="nav" aria-label="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        </button>
        <div class="lang" role="group" aria-label="Language">
          <button id="lang-btn-id" onclick="app.setLanguage('id')">ID</button>
          <button id="lang-btn-en" onclick="app.setLanguage('en')">EN</button>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1"></main>
  <div id="toast" class="toast no-print" role="status" aria-live="polite" hidden></div>

  <div class="search-overlay" id="search-overlay" hidden onclick="if(event.target===this)app.closeSearch()">
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search">
      <input type="search" id="search-input" autocomplete="off" oninput="app.runSearch(this.value)" onkeydown="app.searchKey(event)" />
      <div id="search-results" role="listbox"></div>
      <div class="search-foot muted small" id="search-foot"></div>
    </div>
  </div>

  <footer class="site-footer no-print">
    <div class="inner">
      <span id="footer-tagline"></span>
      <span class="footer-progress">
        <span id="footer-note"></span>
        <button class="link-btn" onclick="app.exportProgress()" id="footer-export"></button>
        <button class="link-btn" onclick="document.getElementById('import-file').click()" id="footer-import"></button>
        <input type="file" id="import-file" accept="application/json" hidden onchange="app.importProgress(this)" />
      </span>
    </div>
  </footer>

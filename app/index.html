<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge – Learn Data Engineering by Doing</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header no-print">
    <div class="header-inner">
      <button class="brand" onclick="app.go('roadmap')" aria-label="DataForge home">
        <span class="brand-mark">DF</span>
        <span class="brand-name">DataForge</span>
      </button>

      <nav class="nav" id="nav" aria-label="Main"></nav>

      <div class="header-tools">
        <div class="lang" role="group" aria-label="Language">
          <button id="lang-btn-id" onclick="app.setLanguage('id')">ID</button>
          <button id="lang-btn-en" onclick="app.setLanguage('en')">EN</button>
        </div>
        <div class="header-progress" id="header-stats"></div>
      </div>
    </div>
  </header>

  <main id="main-content"></main>

  <footer class="site-footer no-print">
    <div class="inner">
      <span id="footer-tagline"></span>
      <span>Progress is stored only in this browser.</span>
    </div>
  </footer>

  <script src="vendor/sqljs/sql-wasm.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/curriculum-data.js"></script>
  <script src="js/interview-data.js"></script>
  <script src="js/portfolio-data.js"></script>
  <script src="js/cv-data.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/remote-playbook.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

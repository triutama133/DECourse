<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge – Learn Data Engineering by Doing</title>
  <meta name="color-scheme" content="light dark" />
  <script>
    /* Set the theme before the first paint, so a dark page never flashes white. Same rule as app.js: saved choice, else the system setting. */
    (function () {
      try {
        var t = localStorage.getItem("df_theme");
        try { t = JSON.parse(t); } catch (e) { /* plain text from an older version */ }
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* storage blocked: app.js picks the theme */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=15" />
</head>
<body>
  <a class="skip-link" href="#main-content" onclick="document.getElementById('main-content').focus()">Skip to content / Lewati ke konten</a>

  <header class="site-header no-print">
    <div class="header-inner">
      <button class="brand" onclick="app.go('roadmap')" aria-label="DataForge home">
        <span class="brand-mark">DF</span>
        <span class="brand-name">DataForge</span>
      </button>

      <div class="header-tools">
        <button class="icon-btn" id="search-btn" onclick="app.openSearch()" aria-label="Search the course (Ctrl+K)" title="Ctrl+K">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
          <span class="icon-btn-label" id="search-btn-label">Search</span>
        </button>
        <button class="icon-btn" id="theme-btn" onclick="app.toggleTheme()" aria-label="Toggle Dark / Light Theme" title="Toggle Dark / Light Theme">
          <span id="theme-btn-icon">🌙</span>
        </button>
        <button class="icon-btn menu-toggle" id="menu-toggle" onclick="app.toggleMenu()" aria-expanded="false" aria-controls="nav" aria-label="Menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        </button>
        <div class="lang" role="group" aria-label="Language">
          <button id="lang-btn-id" onclick="app.setLanguage('id')">ID</button>
          <button id="lang-btn-en" onclick="app.setLanguage('en')">EN</button>
        </div>
        <div class="header-progress" id="header-stats"></div>
      </div>

      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1"></main>

  <div class="search-overlay" id="search-overlay" hidden onclick="if(event.target===this)app.closeSearch()">
    <div class="search-box" role="dialog" aria-modal="true" aria-label="Search">
      <input type="search" id="search-input" autocomplete="off" oninput="app.runSearch(this.value)" onkeydown="app.searchKey(event)" />
      <div id="search-results" role="listbox"></div>
      <div class="search-foot muted small" id="search-foot"></div>
    </div>
  </div>

  <footer class="site-footer no-print">
    <div class="inner">
      <span id="footer-tagline"></span>
      <span class="footer-progress">
        <span id="footer-note"></span>
        <button class="link-btn" onclick="app.exportProgress()" id="footer-export"></button>
        <button class="link-btn" onclick="document.getElementById('import-file').click()" id="footer-import"></button>
        <input type="file" id="import-file" accept="application/json" hidden onchange="app.importProgress(this)" />
      </span>
    </div>
  </footer>

  <script src="vendor/sqljs/sql-wasm.js"></script>
  <script src="js/translations.js?v=11"></script>
  <script src="js/curriculum-data.js?v=12"></script>
  <script src="js/browser-labs-data.js?v=11"></script>
  <script src="js/proof-data.js?v=11"></script>
  <script src="js/proof.js?v=11"></script>
  <script src="js/interview-data.js?v=11"></script>
  <script src="js/portfolio-data.js?v=11"></script>
  <script src="js/cv-data.js?v=11"></script>
  <script src="js/playground.js?v=12"></script>
  <script src="js/remote-playbook.js?v=11"></script>
  <script src="js/practice-labs.js?v=11"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge | The Anti-Tutorial-Hell Data Engineering Operating System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#0a0d14] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-500/30 selection:text-blue-300">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-50 bg-[#0a0d14]/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3.5 no-print">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.switchView('roadmap')">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-emerald-400 flex items-center justify-center font-black text-white text-base shadow-lg shadow-blue-500/20">
          DF
        </div>
        <div>
          <span class="font-extrabold text-base tracking-tight text-white flex items-center gap-1.5">
            DataForge <span class="text-[10px] uppercase font-mono px-1.5 py-0.2 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">2026 Core</span>
          </span>
          <p class="text-[11px] text-slate-400 -mt-0.5">The Anti-Tutorial-Hell DE Learning System</p>
        </div>
      </div>

      <!-- Navigation Pill Bar (Desktop) -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button data-nav="roadmap" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          🚀 Roadmap
        </button>
        <button data-nav="curriculum" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          📚 Curriculum
        </button>
        <button data-nav="interview" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          🎯 Interview Sim
        </button>
        <button data-nav="portfolio" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          💼 Portfolios
        </button>
        <button data-nav="cv-builder" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          📄 CV Builder
        </button>
        <button data-nav="playground" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition-colors">
          💻 SQL Sandbox
        </button>
      </nav>

      <!-- Mastery Progress Meter -->
      <div id="header-stats"></div>
    </div>

    <!-- Mobile Nav Bar -->
    <div class="flex md:hidden items-center justify-around gap-1 pt-3 border-t border-slate-800/60 mt-2 text-[11px] font-semibold text-slate-400 overflow-x-auto">
      <button data-nav="roadmap" class="px-2 py-1">Roadmap</button>
      <button data-nav="curriculum" class="px-2 py-1">Curriculum</button>
      <button data-nav="interview" class="px-2 py-1">Interviews</button>
      <button data-nav="portfolio" class="px-2 py-1">Portfolios</button>
      <button data-nav="cv-builder" class="px-2 py-1">CV</button>
      <button data-nav="playground" class="px-2 py-1">SQL</button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full"></main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-800/80 bg-slate-950/70 px-4 sm:px-8 py-6 text-xs text-slate-500 no-print">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-400">DataForge Platform</span>
        <span>•</span>
        <span>Architected for True Data Engineering Mastery</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <a href="#" onclick="app.switchView('curriculum'); return false;" class="hover:text-blue-400 transition-colors">Curriculum</a>
        <a href="#" onclick="app.switchView('interview'); return false;" class="hover:text-blue-400 transition-colors">Interviews</a>
        <a href="#" onclick="app.switchView('portfolio'); return false;" class="hover:text-blue-400 transition-colors">Portfolios</a>
        <a href="#" onclick="app.switchView('cv-builder'); return false;" class="hover:text-blue-400 transition-colors">ATS CV</a>
      </div>
    </div>
  </footer>

  <!-- Application Scripts -->
  <script src="js/curriculum-data.js"></script>
  <script src="js/interview-data.js"></script>
  <script src="js/portfolio-data.js"></script>
  <script src="js/cv-data.js"></script>
  <script src="js/playground.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

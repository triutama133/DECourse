name: Labs on the newest packages

# The main CI pins exact versions (constraints-ci.txt). This weekly run installs the newest releases instead,
# so a breaking release (like DuckDB 2.0 removing Relation.fetchone) shows up here first, not in a learner's terminal.
on:
  schedule:
    - cron: "0 2 * * 1"      # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  labs-latest:
    name: Labs with the newest packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the newest packages
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest duckdb polars pydantic pandas pyarrow "psycopg[binary]" pgserver
          pip list | grep -iE "^(duckdb|polars|pandas|pyarrow|pydantic|pytest) "

      - name: Lab proof codes end to end
        run: python3 scripts/test_proof.py

      - name: Try it checkers
        run: python3 scripts/test_tryit.py

      - name: Core lab tests
        run: |
          python3 scripts/verify_labs.py mod-0-0 mod-0-1 mod-0-2 mod-0-3 mod-1-1 mod-1-2 mod-1-3 mod-1-4 mod-1-5 mod-1-6 mod-1-7 mod-2-1 mod-2-6 mod-3-0 mod-4-1 mod-4-2 mod-4-3

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  curriculum-check:
    name: Validate Curriculum & Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Curriculum Compilation
        run: |
          node scripts/build-curriculum.js --check

      - name: Verify Generated Files Are Committed
        run: |
          node scripts/build-curriculum.js
          git diff --exit-code app/js/curriculum-data.js app/js/browser-labs-data.js app/js/proof-data.js

      - name: Validate JavaScript Syntax
        run: |
          node -c app/server.js
          node -c scripts/build-curriculum.js
          node -c scripts/export-sandbox-lab.js
          for f in app/js/*.js; do
            # the worker is an ES module (uses import); node -c only checks classic scripts
            [ "$f" = "app/js/pyodide-worker.js" ] && continue
            node -c "$f"
          done

      - name: Verify in-browser Python labs (real Pyodide)
        run: node scripts/verify_browser_labs.js

      - name: Verify every SQL Sandbox challenge (real SQLite engine)
        run: node scripts/verify_sandbox.js

      - name: Check Python and JavaScript hash rules agree
        run: |
          python3 scripts/prove.py --hashes > /tmp/py_hashes.json
          node -e "global.window={};eval(require('fs').readFileSync('app/js/proof-data.js','utf8'));const py=JSON.parse(require('fs').readFileSync('/tmp/py_hashes.json','utf8'));let bad=0;for(const m of Object.keys(window.PROOF))for(const k of ['tests','starter','reference'])if(window.PROOF[m][k]!==py[m][k]){bad++;console.log('MISMATCH',m,k)}process.exit(bad?1:0)"

  test-labs-core:
    name: Verify Labs (Core & Level 0-1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Base Test Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest duckdb polars pydantic pandas pyarrow

      - name: Run Level 0 & Level 1 Shell Verifications
        run: |
          bash labs/mod-0-2/verify.sh
          bash labs/mod-0-3/verify.sh
          bash labs/mod-1-3/verify.sh
          bash labs/mod-1-4/verify.sh

      - name: Test lab proof codes end to end
        run: python3 scripts/test_proof.py

      - name: Run Core Lab Tests
        run: |
          python3 scripts/verify_labs.py mod-0-0 mod-0-1 mod-0-2 mod-0-3 mod-1-1 mod-1-2 mod-1-3 mod-1-4 mod-1-5 mod-1-6 mod-1-7 mod-2-1 mod-2-6 mod-3-0 mod-4-1 mod-4-2 mod-4-3

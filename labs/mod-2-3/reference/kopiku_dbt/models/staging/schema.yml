version: 2

models:
  - name: stg_orders
    description: One row per order (latest version), typed and cleaned.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, shipped, delivered, cancelled, refunded]
      - name: total_idr
        data_tests: [not_null]

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
